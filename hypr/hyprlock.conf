# Colores y fondo generados por wallust (wallust/templates/colors-hyprlock.conf)
source = ~/.config/hypr/hyprlock-wallust.conf

general {
    disable_loading_bar = true
    no_fade_in = false
}

background {
    monitor =
    path = $wal_wallpaper
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
}

animations {
    enabled = true
}

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    color = rgba(f8f4ecff)
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    color = $wal_fg_dim
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 500, 70
    position = 0, -100
    halign = center
    valign = center

    inner_color = $wal_bg
    outer_color = $wal_accent
    outline_thickness = 3

    font_family = JetBrainsMono Nerd Font
    font_size = 24
    font_color = rgba(f8f4ecff)

    placeholder_color = $wal_fg_dim
    placeholder_text = 󰌾  Contraseña
    check_color = $wal_accent2
    fail_text = ✗  Contraseña incorrecta
    fail_color = $wal_fail

    rounding = 10
    shadow_passes = 2
    fade_on_empty = false
}
