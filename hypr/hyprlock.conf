general {
    disable_loading_bar = true
    no_fade_in = false
}

background {
    monitor =
    path = /home/h4ch3/Pictures/wallpaper.jpg
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
}

animations {
    enabled = true
}

label {
    monitor =
    text = $TIME
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    color = rgba(205, 214, 244, 1.0)
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 24
    font_family = JetBrainsMono Nerd Font
    color = rgba(205, 214, 244, 0.8)
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 500, 70
    position = 0, -100
    halign = center
    valign = center

    inner_color = rgba(26, 27, 38, 0.8)
    outer_color = rgba(122, 135, 253, 1.0)
    outline_thickness = 3

    font_family = JetBrainsMono Nerd Font
    font_size = 24
    font_color = rgba(205, 214, 244, 1.0)

    placeholder_color = rgba(205, 214, 244, 0.6)
    placeholder_text = 󰌾 Enter Password
    check_color = rgba(68, 157, 171, 1.0)
    fail_text = ✗ Wrong Password
    fail_color = rgba(243, 139, 168, 1.0)

    rounding = 10
    shadow_passes = 2
    fade_on_empty = false
}
