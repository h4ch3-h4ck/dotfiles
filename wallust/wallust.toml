# Wallust — genera la paleta a partir del fondo y la escribe en las plantillas.
# Ghostty: híbrido. Solo fondo/cursor/selección; la paleta ANSI sigue siendo TokyoNight Moon.
# Uso: wallust run -s <imagen>   (-s: no cambiar los colores de los terminales abiertos)
backend = "fastresize"
color_space = "lch"
palette = "dark16"
check_contrast = true

[templates]
waybar = { template = "colors-waybar.css", target = "~/.config/waybar/wallust/colors-waybar.css" }
rofi   = { template = "colors-rofi.rasi",  target = "~/.config/rofi/wallust/colors-rofi.rasi" }
ghostty = { template = "colors-ghostty.conf", target = "~/.config/ghostty/wallust.conf" }
hyprlock = { template = "colors-hyprlock.conf", target = "~/.config/hypr/hyprlock-wallust.conf" }
sway   = { template = "colors-sway",       target = "~/.config/sway/config.d/25-wallust" }
